name: Outbound Comms Analysis - Clean Data

on:
  schedule:
    - cron: '0 22 * * *' 
  workflow_dispatch: 

jobs:
  run-data-cleaner:
    runs-on: macos-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install System Dependencies
        run: brew install curl openssl libxml2 

      - name: Install R Libraries
        run: |
          Rscript -e 'install.packages(c("dplyr","readr","googlesheets4","tidyr","purrr","lubridate","sringr"))'

      - name: Data Cleaner
        continue-on-error: true
        run: Rscript misc/outbound-comms-analysis-clean-data.R

      - name: Debug - List Files
        run: |
          echo "Files in root:"
          ls -l *.csv || echo "No CSVs in root"
          echo "Files in data folder:"
          ls -R misc/

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # -A stages EVERYTHING that changed, making it bulletproof
          git add -A
          git commit -m "Updated Outbound lists on: $(date +'%Y-%m-%d')" || echo "Files are up to date. No new data was committed."
          git push
