name: Basketball Stats App Daily Data Update

on:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:

# Serialize with the NBA/WNBA workflow: both rebuild and push app-data.rds, so
# they must never run at the same time. A queued run waits rather than being dropped.
concurrency:
  group: bball-data
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git pull --rebase to work reliably

      - name: Check runner IP / geo
        run: curl -s https://ipinfo.io

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Uses fast, pre-compiled binaries instead of compiling from source

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev

      - name: Install R Libraries
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::purrr
            any::tidyr
            any::stringr
            any::stringi
            any::httr
            any::jsonlite
            any::glue
            any::janitor
            any::lubridate
            any::rvest
            any::readr
            any::xml2
            any::vroom

      #- name: NBB Scraper # run this locally, 403 error :(
      #- name: Pro A Scraper # on hold - scraper being updated for LNB's new v3 API

      - name: Serie A Scraper
        id: scrape_it
        continue-on-error: true
        run: Rscript bball-stats/scrapers/IT-scraper.R

      - name: BBL Scraper
        id: scrape_de
        continue-on-error: true
        env:
          BBL_API_SECRET: ${{ secrets.BBL_API_SECRET }}
        run: Rscript bball-stats/scrapers/DE-scraper.R

      - name: ACB Scraper
        id: scrape_es
        continue-on-error: true
        run: Rscript bball-stats/scrapers/ES-scraper.R

      - name: TBSL Scraper
        id: scrape_tr
        continue-on-error: true
        run: Rscript bball-stats/scrapers/TR-scraper.R

      - name: Euroleague Scraper
        id: scrape_el
        continue-on-error: true
        run: Rscript bball-stats/scrapers/EL-scraper.R

      - name: Eurocup Scraper
        id: scrape_ec
        continue-on-error: true
        run: Rscript bball-stats/scrapers/EC-scraper.R

      - name: GBL Scraper
        id: scrape_gr
        continue-on-error: true
        run: Rscript bball-stats/scrapers/GR-scraper.R

      - name: Build app-data.rds
        run: Rscript bball-stats/bball-stats-app-build-data.R

      - name: Debug - List Files
        run: |
          echo "Files in root:"
          ls -l *.csv || echo "No CSVs in root"
          echo "Files in data folder:"
          ls -R bball-stats/data/

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Updated data on: $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push origin main

      # Per-league result on the run's summary page.
      - name: Scraper summary
        if: always()
        run: |
          echo "## Daily scraper results — $(date +'%Y-%m-%d')" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          report () {
            if [ "$2" = "success" ]; then
              echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $1 (${2:-skipped})" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
          }
          report "Serie A"    "${{ steps.scrape_it.outcome }}"
          report "BBL"        "${{ steps.scrape_de.outcome }}"
          report "ACB"        "${{ steps.scrape_es.outcome }}"
          report "TBSL"       "${{ steps.scrape_tr.outcome }}"
          report "Euroleague" "${{ steps.scrape_el.outcome }}"
          report "Eurocup"    "${{ steps.scrape_ec.outcome }}"
          report "GBL"        "${{ steps.scrape_gr.outcome }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -eq 0 ]; then
            echo "**All 7 league scrapers succeeded.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**$failed of 7 league scrapers failed — data for those leagues may be stale.**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Failed scrapers: $failed of 7"
