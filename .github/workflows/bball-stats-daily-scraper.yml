name: Basketball Stats App Daily Data Update

on:
  schedule:
    - cron: '0 2 * * *' 
  workflow_dispatch: 

jobs:
  run-scrapers:
    runs-on: macos-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install System Dependencies
        run: brew install curl openssl libxml2 

      - name: Install R Libraries
        run: |
          Rscript -e 'install.packages(c("dplyr", "purrr", "tidyr", "stringr", "stringi", "httr", "jsonlite", "glue", "janitor", "lubridate"))'

      - name: Run Scrapers
        # Running from root so we don't get confused about paths
        run: |
          Rscript bball-stats/scrapers/FR-scraper.R || echo "FR Scraper failed"
          Rscript bball-stats/scrapers/IT-scraper.R || echo "IT Scraper failed"

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Git add from the root perspective
          git add bball-stats/data/*.csv
          git commit -m "Updated data on: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
