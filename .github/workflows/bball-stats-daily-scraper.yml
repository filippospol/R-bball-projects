name: Basketball Stats App Daily Data Update

on:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git pull --rebase to work reliably

      - name: Check runner IP / geo
        run: curl -s https://ipinfo.io

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Uses fast, pre-compiled binaries instead of compiling from source

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev

      - name: Install R Libraries
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::purrr
            any::tidyr
            any::stringr
            any::stringi
            any::httr
            any::jsonlite
            any::glue
            any::janitor
            any::lubridate
            any::rvest
            any::readr
            any::xml2
            any::vroom

      # ---------------------------------------------------------------------------------------
      # TBSL fixtures: TBF only fills in the FIBA LiveStats id shortly before each round, so the
      # fixtures file has to be refreshed regularly. Playwright is installed OUTSIDE the repo
      # ($RUNNER_TEMP) so `git add .` below never picks up node_modules / package.json.
      # ---------------------------------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i playwright@1
          npx playwright install --with-deps chromium

      - name: Refresh TBSL fixtures
        continue-on-error: true   # a Cloudflare hiccup must not block the other scrapers
        env:
          ACTIVITY_ID: "22214"                                        # update once per season
          SEASON_URL: "https://www.tbf.org.tr/ligler/bsl-2026-2027"   # update once per season
        run: |
          # script lives next to its node_modules, but is executed from the repo root so
          # the relative output path resolves to bball-stats/scrapers/tbsl-fixtures.json
          cp bball-stats/scrapers/fetch-fixtures.mjs "$RUNNER_TEMP/pw/"
          node "$RUNNER_TEMP/pw/fetch-fixtures.mjs"

      - name: TBSL Scraper
        continue-on-error: true
        run: Rscript bball-stats/scrapers/TR-scraper.R

      #- name: NBB Scraper # run this locally, 403 error :(
      #- name: Pro A Scraper # run this locally, 403 error :(

      - name: Serie A Scraper
        continue-on-error: true
        run: Rscript bball-stats/scrapers/IT-scraper.R

      - name: BBL Scraper
        continue-on-error: true
        env:
          BBL_API_SECRET: ${{ secrets.BBL_API_SECRET }}
        run: Rscript bball-stats/scrapers/DE-scraper.R

      - name: ACB Scraper
        continue-on-error: true
        run: Rscript bball-stats/scrapers/ES-scraper.R

      - name: Euroleague Scraper
        continue-on-error: true
        run: Rscript bball-stats/scrapers/EL-scraper.R

      - name: Eurocup Scraper
        continue-on-error: true
        run: Rscript bball-stats/scrapers/EC-scraper.R

      #- name: GBL Scraper
      #  continue-on-error: true
      #  run: Rscript bball-stats/scrapers/GR-scraper.R

      - name: Build app-data.rds
        run: Rscript bball-stats/bball-stats-app-build-data.R

      - name: Debug - List Files
        run: |
          echo "Files in root:"
          ls -l *.csv || echo "No CSVs in root"
          echo "Files in data folder:"
          ls -R bball-stats/data/
          echo "TBSL fixtures with ids:"
          grep -c '"geniusId": "[0-9]' bball-stats/scrapers/tbsl-fixtures.json || true

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Updated data on: $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push origin main
