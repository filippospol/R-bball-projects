name: Basketball Stats App Daily Data Update

on:
  schedule:
    - cron: '0 02 * * *' 
  workflow_dispatch: 

jobs:
  run-scrapers:
    runs-on: macos-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install System Dependencies
        run: brew install curl openssl libxml2 

      - name: Install R Libraries
        run: |
          Rscript -e 'install.packages(c("dplyr", "purrr", "tidyr", "stringr", "stringi", "httr", "jsonlite", "glue", "janitor", "lubridate","rvest"))'

      - name: Run Scrapers
        run: |
          Rscript bball-stats/scrapers/FR-scraper.R
          Rscript bball-stats/scrapers/IT-scraper.R
          Rscript bball-stats/scrapers/DE-scraper.R
          Rscript bball-stats/scrapers/EL-scraper.R
          Rscript bball-stats/scrapers/EC-scraper.R

      - name: Debug - List Files
        run: |
          echo "Files in root:"
          ls -l *.csv || echo "No CSVs in root"
          echo "Files in data folder:"
          ls -R bball-stats/data/

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # -A stages EVERYTHING that changed, making it bulletproof
          git add -A
          git commit -m "Updated data on: $(date +'%Y-%m-%d')" || echo "Files are up to date. No new data was committed."
          git push
