name: Live score watcher

# Starts around the first final each night (Greek time), then polls ESPN every
# few minutes and commits each game's score + hype rating the moment it goes
# Final — stopping on its own once the whole slate is done. GitHub can start a
# scheduled run late, but the watcher simply catches up whatever has finished.
on:
  schedule:
    - cron: "0 3 * * *"          # ~03:00 Greek — just before the earliest finals
      timezone: "Europe/Athens"
  workflow_dispatch:             # also start it by hand from the Actions tab

permissions:
  contents: write

# Never let two data jobs push at the same time (shared with the backstops).
concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340         # a hard ceiling; it usually exits much earlier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll ESPN and commit as games finish
        env:
          POLL_SECONDS: "300"    # check every 5 minutes
          MAX_MINUTES: "330"     # stop after ~5.5h even if ESPN never says "done"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date +%s)
          while : ; do
            out="$(python scripts/live_update.py || true)"
            echo "$out"
            pending="$(printf '%s\n' "$out" | sed -n 's/^PENDING=//p' | tail -1)"

            python scripts/excitement.py || true     # rate any newly-final games

            git add schedule.json ratings.json
            if git diff --cached --quiet; then
              echo "No changes this pass."
            else
              git commit -m "Live update — scores & ratings"
              git pull --rebase --autostash || true
              git push
            fi

            if [ "${pending:-0}" = "0" ]; then
              echo "All of tonight's games are final — watcher done."
              break
            fi
            mins=$(( ( $(date +%s) - start ) / 60 ))
            if [ "$mins" -ge "${MAX_MINUTES}" ]; then
              echo "Hit max runtime — stopping."
              break
            fi
            sleep "${POLL_SECONDS}"
          done
